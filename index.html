<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>항로 기상 중첩도 아카이브</title>
<meta name="description" content="항로 기상 중첩 지도의 회차별 이력">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#16283D; --muted:#5B6B7C; --rule:#D3DAE1;
  --accent:#A8327E; --accent-ink:#FFFFFF; --chip:#E4E9EE; --shadow:0 1px 2px rgba(22,40,61,.06),0 4px 14px rgba(22,40,61,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141C25; --panel:#1C2733; --ink:#E4EAF0; --muted:#9AA9B8; --rule:#2F4050;
    --accent:#E07AB8; --accent-ink:#1A1020; --chip:#26333F; --shadow:none; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 48px}
header h1{font-size:24px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:14px}
header a{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:22px 0 8px;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.filters input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:7px;padding:7px 10px;min-height:38px}
.filters .q{flex:1 1 220px}
.filters .q input{width:100%}
.filters button{font:inherit;min-height:38px;padding:0 14px;border-radius:7px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.tagbar button,.tags span{font:inherit;font-size:12.5px;border-radius:14px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:3px 11px;cursor:pointer}
.tagbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tags span{cursor:default;font-size:11.5px;padding:1px 8px;background:var(--chip);border-color:transparent;color:var(--muted)}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.grip{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.6);
  background:rgba(22,40,61,.62);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;cursor:grab;touch-action:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.grip:hover{background:rgba(22,40,61,.8)}
.card.placeholder{opacity:.35;outline:2px dashed var(--accent);outline-offset:-2px;box-shadow:none}
.card.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 18px 40px rgba(0,0,0,.28);transform:rotate(1.5deg) scale(1.02);opacity:.96}
.card.moved{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.countbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 2px 14px}
.countbar .count{margin:0}
.orderinfo{font-size:12.5px;color:var(--muted)}
.orderinfo button{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.card.moved{animation:none}.card.ghost{transform:none}}
.thumb{display:block;aspect-ratio:16/7;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.time{font-size:13px;color:var(--accent);font-weight:600}
.rnd{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 7px;margin-right:6px;font-size:12.5px}
.body h2{font-size:17px;line-height:1.35;margin:0}
.memo{margin:0;color:var(--muted);font-size:13.5px;white-space:pre-line}
.reg{color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:10px}
.actions a,.actions button{font:inherit;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:7px;border:1px solid var(--rule);color:var(--ink);background:transparent;cursor:pointer}
.actions .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.actions button:disabled{opacity:.45;cursor:default}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--rule);border-radius:12px}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,16,24,.6)}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel)}
.dhead h3{margin:0;font-size:15px;flex:1}
.dhead button{font:inherit;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:7px;min-height:34px;padding:0 12px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
.gallery a{display:block;color:var(--ink);text-decoration:none;font-size:12.5px}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--rule);background:var(--chip);display:block;margin-bottom:4px}
.gallery span{word-break:break-all;color:var(--muted)}
footer{margin-top:36px;color:var(--muted);font-size:12.5px}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .filters label:not(.q){flex:1 1 40%}
  .filters input[type=date]{width:100%}
  header h1{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>항로 기상 중첩도 아카이브</h1>
    <p>회차별 항로·기상 중첩 지도 이력입니다. 기준시각은 모두 UTC입니다. · <a href="latest/">최신 회차 바로 보기</a> · <a href="compare.html">두 회차 비교</a></p>
  </header>

  <form class="filters" id="filters" role="search" onsubmit="return false">
    <label>시작일 (UTC)<input type="date" id="from"></label>
    <label>종료일 (UTC)<input type="date" id="to"></label>
    <label class="q">제목·메모 검색<input type="search" id="q" placeholder="예: OZ222, SIGMET, 제트기류"></label>
    <button type="button" id="reset">초기화</button>
    <div class="tagbar" id="tagbar" role="group" aria-label="태그로 거르기"></div>
  </form>

  <div class="countbar">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="orderinfo" id="orderinfo">카드 오른쪽 위 ⠿ 를 끌어 순서를 바꿀 수 있습니다 (이 브라우저에만 저장)</div>
  </div>
  <div class="sr" id="live" aria-live="assertive"></div>
  <ul class="grid" id="list"></ul>

  <footer>연구·학습용 참고 자료입니다. 실제 운항 판단에는 공식 브리핑 자료를 사용하세요.</footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dhead"><h3 id="dlg-title">원본 캡처</h3><button type="button" id="dlg-close">닫기</button></div>
  <div class="gallery" id="gallery"></div>
</dialog>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const list=$('list'), count=$('count'), from=$('from'), to=$('to'), q=$('q');
  let entries=[]; const active=new Set();
  const ver=(e,u)=>u+(e.version?(u.includes('?')?'&':'?')+'v='+e.version:'');

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmtUTC(iso){
    const d=new Date(iso); if(isNaN(d)) return esc(iso);
    const p=n=>String(n).padStart(2,'0');
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}${p(d.getUTCMinutes())} UTC`;
  }

  function render(){
    const f=from.value, t=to.value, term=q.value.trim().toLowerCase();
    const rows=entries.filter(e=>{
      const day=(e.time_utc||'').slice(0,10);
      if(f && day<f) return false;
      if(t && day>t) return false;
      if(term && !((e.title||'')+' '+(e.memo||'')+' '+(e.tags||[]).join(' ')).toLowerCase().includes(term)) return false;
      for(const t of active) if(!(e.tags||[]).includes(t)) return false;
      return true;
    });
    count.textContent = entries.length ? `전체 ${entries.length}건 중 ${rows.length}건 표시` : '';
    if(!rows.length){
      list.innerHTML=`<li class="empty">${entries.length?'조건에 맞는 회차가 없습니다.':'아직 등록된 회차가 없습니다.'}</li>`;
      return;
    }
    list.innerHTML=rows.map(e=>{
      const n=(e.sources||[]).length;
      return `<li class="card" data-card="${esc(e.id)}">
        <button type="button" class="grip" data-grip="${esc(e.id)}" aria-label="${esc(e.title)} 카드 순서 옮기기. 끌거나 방향키로 이동" title="끌어서 순서 바꾸기 (방향키도 가능)">⠿</button>
        <a class="thumb" href="${esc(ver(e,e.map))}" aria-label="${esc(e.title)} 지도 열기"><img src="${esc(ver(e,e.thumb))}" alt="" loading="lazy" width="800" height="350"></a>
        <div class="body">
          <div class="time">${e.round?`<span class="rnd">${e.round}회차</span>`:''}${fmtUTC(e.time_utc)}</div>
          <h2>${esc(e.title)}</h2>
          ${e.memo?`<p class="memo">${esc(e.memo)}</p>`:''}
          ${(e.tags||[]).length?`<div class="tags">${e.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
          <div class="reg">등록 ${esc(e.registered)}</div>
          <div class="actions">
            <a class="primary" href="${esc(ver(e,e.map))}">지도 열기</a>
            <a href="${esc(ver(e,e.composite))}" target="_blank" rel="noopener">합성 이미지</a>
            <button type="button" data-id="${esc(e.id)}" ${n?'':'disabled'}>원본 캡처${n?` (${n})`:''}</button>
            <a href="compare.html?a=${encodeURIComponent(e.id)}">비교</a>
          </div>
        </div>
      </li>`;
    }).join('');
  }

  list.addEventListener('click',ev=>{
    const b=ev.target.closest('button[data-id]'); if(!b) return;
    const e=entries.find(x=>x.id===b.dataset.id); if(!e) return;
    $('dlg-title').textContent=`원본 캡처 · ${e.title}`;
    $('gallery').innerHTML=e.sources.map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener"><img src="${esc(s)}" alt="" loading="lazy"><span>${esc(s.split('/').pop())}</span></a>`).join('');
    $('dlg').showModal();
  });
  $('dlg-close').onclick=()=>$('dlg').close();
  $('dlg').addEventListener('click',ev=>{ if(ev.target===$('dlg')) $('dlg').close(); });

  [from,to,q].forEach(el=>el.addEventListener('input',render));
  $('reset').onclick=()=>{from.value='';to.value='';q.value='';active.clear();renderTags();render();};
  function renderTags(){
    const all=[...new Set(entries.flatMap(e=>e.tags||[]))];
    $('tagbar').innerHTML=all.map(t=>`<button type="button" aria-pressed="${active.has(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  }
  $('tagbar').addEventListener('click',ev=>{const b=ev.target.closest('button[data-t]'); if(!b) return;
    const t=b.dataset.t; active.has(t)?active.delete(t):active.add(t); renderTags(); render();});

  // ---- 카드 순서: 이 브라우저에만 저장 ----
  const KEY='route-map-card-order';
  let defaultIds=[];
  const loadOrder=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return Array.isArray(v)?v:null;}catch(_){return null;}};
  const saveOrder=ids=>{try{localStorage.setItem(KEY,JSON.stringify(ids));}catch(_){}};
  const clearOrder=()=>{try{localStorage.removeItem(KEY);}catch(_){}};
  function applyOrder(){
    const saved=loadOrder();
    if(!saved){entries.sort((a,b)=>defaultIds.indexOf(a.id)-defaultIds.indexOf(b.id));}
    else{
      const pos=id=>{const i=saved.indexOf(id);return i<0?-1:i;};     // 새로 등록된 회차(저장 안 된 것)는 맨 앞
      entries.sort((a,b)=>(pos(a.id)-pos(b.id))||(defaultIds.indexOf(a.id)-defaultIds.indexOf(b.id)));
    }
    const custom=!!saved && entries.some((e,i)=>e.id!==defaultIds[i]);
    $('orderinfo').innerHTML=custom
      ? '내가 정한 순서로 보는 중 (이 브라우저에만 저장) · <button type="button" id="resetOrder">기본 순서(회차순)로 되돌리기</button>'
      : '카드 오른쪽 위 ⠿ 를 끌어 순서를 바꿀 수 있습니다 (이 브라우저에만 저장)';
    if(custom) $('resetOrder').onclick=()=>{clearOrder();applyOrder();render();$('live').textContent='기본 순서로 되돌렸습니다';};
  }
  function commitVisibleOrder(){
    // 화면에 보이는 카드 순서를 전체 순서에 반영 (필터로 숨긴 카드는 제자리)
    const vis=[...list.querySelectorAll('.card[data-card]')].map(li=>li.dataset.card);
    const set=new Set(vis); let k=0;
    const ids=entries.map(e=>e.id).map(id=>set.has(id)?vis[k++]:id);
    saveOrder(ids); applyOrder();
  }
  const cards=()=>[...list.querySelectorAll('.card[data-card]')];
  // 포인터(마우스·터치)로 끌기
  let drag=null;
  list.addEventListener('pointerdown',ev=>{
    const g=ev.target.closest('.grip'); if(!g||ev.button>0) return;
    ev.preventDefault();
    const li=g.closest('.card'), r=li.getBoundingClientRect();
    const ghost=li.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('data-card');
    ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
    document.body.appendChild(ghost); li.classList.add('placeholder'); document.body.classList.add('dragging');
    drag={li,ghost,dx:ev.clientX-r.left,dy:ev.clientY-r.top,id:ev.pointerId,x:ev.clientX,y:ev.clientY,start:cards().indexOf(li)};
    g.setPointerCapture(ev.pointerId);
  });
  function moveTo(x,y){
    const {li,ghost}=drag; ghost.style.left=(x-drag.dx)+'px'; ghost.style.top=(y-drag.dy)+'px';
    let best=null;
    for(const c of cards()){ if(c===li) continue; const r=c.getBoundingClientRect();
      const d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2)); if(!best||d<best.d) best={c,r,d}; }
    if(!best) return;
    const lr=li.getBoundingClientRect(), r=best.r;
    if(x<r.left-8||x>r.right+8||y<r.top-8||y>r.bottom+8) return;          // 다른 카드 위에 있을 때만 자리 바꿈
    const sameRow=Math.abs(r.top-lr.top)<r.height/2;
    const after=sameRow ? x>r.left+r.width/2 : y>r.top+r.height/2;
    const ref=after?best.c.nextSibling:best.c;
    if(ref!==li && ref!==li.nextSibling) flip(()=>list.insertBefore(li,ref));
  }
  function flip(change){                                 // 자리 바뀔 때 부드럽게 미끄러지기
    const before=new Map(cards().map(c=>[c,c.getBoundingClientRect()])); change();
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    for(const [c,b] of before){ const a=c.getBoundingClientRect(); const dx=b.left-a.left, dy=b.top-a.top;
      if(dx||dy) c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:180,easing:'ease-out'}); }
  }
  let scrollTimer=null;
  list.addEventListener('pointermove',ev=>{
    if(!drag||ev.pointerId!==drag.id) return;
    drag.x=ev.clientX; drag.y=ev.clientY; moveTo(drag.x,drag.y);
    const edge=70, v=ev.clientY<edge?-(edge-ev.clientY)/4:ev.clientY>innerHeight-edge?(ev.clientY-innerHeight+edge)/4:0;
    clearInterval(scrollTimer); if(v) scrollTimer=setInterval(()=>{scrollBy(0,v); if(drag) moveTo(drag.x,drag.y);},16);
  });
  function endDrag(ev){
    if(!drag||ev.pointerId!==drag.id) return;
    clearInterval(scrollTimer);
    const {li,ghost,start}=drag; drag=null;
    ghost.remove(); li.classList.remove('placeholder'); document.body.classList.remove('dragging');
    const end=cards().indexOf(li);
    if(end!==start){ commitVisibleOrder(); li.classList.add('moved'); setTimeout(()=>li.classList.remove('moved'),900);
      $('live').textContent=`${end+1}번째 자리로 옮겼습니다`; }
  }
  list.addEventListener('pointerup',endDrag); list.addEventListener('pointercancel',endDrag);
  // 키보드: 손잡이에 초점을 두고 방향키로 이동
  list.addEventListener('keydown',ev=>{
    const g=ev.target.closest('.grip'); if(!g) return;
    const d={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[ev.key]; if(!d) return;
    ev.preventDefault();
    const li=g.closest('.card'), cs=cards(), i=cs.indexOf(li), j=i+d;
    if(j<0||j>=cs.length) return;
    flip(()=>list.insertBefore(li,d<0?cs[j]:cs[j].nextSibling));
    commitVisibleOrder(); g.focus();
    $('live').textContent=`${j+1}번째 자리로 옮겼습니다`;
  });

  fetch('entries.json',{cache:'no-cache'}).then(r=>r.json()).then(data=>{
    entries=(Array.isArray(data)?data:data.entries||[]).slice().sort((a,b)=>((b.round||0)-(a.round||0))||(b.time_utc||'').localeCompare(a.time_utc||''));
    defaultIds=entries.map(e=>e.id); applyOrder();
    renderTags(); render();
  }).catch(()=>{ list.innerHTML='<li class="empty">회차 목록(entries.json)을 불러오지 못했습니다.</li>'; });
})();
</script>
</body>
</html>
